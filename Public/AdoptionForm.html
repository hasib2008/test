<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storm's Species - Adoption Application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="Images/FaviconPawprint.png">
</head>
<body>

    <header>
        <img src="Images/logo.jpg" alt="Site Logo" id="site-logo">
        <h1>Submit Your Adoption Application</h1>
    </header>

    <main>
        <div class="form-container">
            <form id="adoption-form">
                
                <!-- Hidden input field to hold the unique PetId behind the scenes -->
                <input type="hidden" id="PETID">

                <div class="form-group">
                    <label for="ANIMALNAME">Chosen Pet:</label>
                    <input type="text" id="ANIMALNAME" readonly>
                    <small>This field fills automatically from your gallery selection.</small>
                </div>

                <div class="form-group">
                    <label for="NAME">First Name:</label>
                    <input type="text" id="NAME" placeholder="Enter your first name" required>
                </div>

                <div class="form-group">
                    <label for="SURNAME">Surname:</label>
                    <input type="text" id="SURNAME" placeholder="Enter your surname" required>
                </div>

                <div class="form-group">
                    <label for="CITY">City / Town:</label>
                    <input type="text" id="CITY" placeholder="e.g. Pietermaritzburg" required>
                </div>

                <div class="form-group">
                    <label for="EMAIL">Email Address:</label>
                    <input type="email" id="EMAIL" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="PHONE">Phone Number:</label>
                    <input type="tel" id="PHONE" placeholder="e.g. 082 123 4567" required>
                </div>

                <button type="submit">Submit Adoption Application</button>
            </form>

            <p class="cancel-link">
                <a href="index.html">← Cancel and Back to Gallery</a>
            </p>
        </div>
    </main>

        <script src="script.js"></script>
</body>
</html>
